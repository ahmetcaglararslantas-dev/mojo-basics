<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mojo Art & Coffee - Yeni Menü</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Eğlenceli ve Yuvarlak Hatlı Font: Nunito -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      /* Canlı, hareketli pastel bir arka plan */
      background: linear-gradient(-45deg, #fbc2eb, #a6c1ee, #fbc2eb, #ffecd2);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Organik Şekiller (Blob) ve Eğlenceli Butonlar */
    .blob-shape {
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .blob-shape:hover {
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transform: translateY(-8px) scale(1.03) rotate(-2deg);
      box-shadow: 0 15px 25px -5px rgba(0,0,0,0.15);
    }

    /* Kartlar için hafif asimetrik kesimler */
    .fun-card {
      border-radius: 24px 8px 24px 8px;
      border: 3px solid #fff;
      transition: all 0.3s ease;
    }
    .fun-card:hover {
      border-radius: 8px 24px 8px 24px;
      transform: translateY(-5px);
      box-shadow: 8px 8px 0px rgba(0,0,0,0.05);
    }

    /* Sayfa Geçiş Animasyonları */
    .page-enter {
      animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .page-exit {
      animation: zoomOut 0.3s ease-in forwards;
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.8) translateY(40px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes zoomOut {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.9) translateY(-20px); }
    }

    /* Yatay Scroll Gizleme */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Logo Dönme Efekti */
    .spin-slow {
      animation: spin 10s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="text-stone-800 min-h-screen pb-20 select-none">

  <!-- Üst Bar: Yarı Saydam ve Dalgalı Hissiyat -->
  <header class="sticky top-0 bg-white/40 backdrop-blur-md shadow-sm z-50 px-4 sm:px-8 py-3 flex items-center justify-between">
    <div class="w-24">
      <button id="backBtn" onclick="goBack()" class="hidden text-sm font-bold bg-white/80 text-[#884d66] border-2 border-[#884d66] px-4 py-2 rounded-full shadow hover:bg-[#884d66] hover:text-white transition-colors active:scale-90">
        🐙 Geri
      </button>
    </div>
    
    <!-- Eğlenceli Logo Alanı -->
    <div class="flex flex-col items-center justify-center text-center cursor-pointer group" onclick="renderStep1()">
      <div class="relative">
     <img src="logo.jpg" alt="Mojo Art Logo" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover shadow-lg border-4 border-white z-10 relative group-hover:scale-110 transition-transform spin-slow" />
        <!-- Arkada dönen renkli haleler (Süsleme) -->
        <div class="absolute inset-0 bg-pink-400 rounded-full blur-md opacity-50 group-hover:opacity-80 transition-opacity"></div>
      </div>
      <h1 class="text-xl sm:text-2xl font-black tracking-widest text-[#653655] mt-2 drop-shadow-sm">MOJO ART</h1>
    </div>

    <div class="w-24"></div>
  </header>

  <!-- Ana Taşıyıcı: İçerik buraya yüklenecek ve animasyon alacak -->
  <main class="w-full max-w-5xl mx-auto px-4 sm:px-8 py-8">
    
    <div id="headerArea" class="text-center mb-8 bg-white/60 p-4 rounded-3xl inline-block w-full max-w-md mx-auto shadow-sm border border-white/50">
      <h2 id="viewTitle" class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#ff6b6b] to-[#5f27cd]">Sihirli Menümüz</h2>
      <p id="viewSubtitle" class="text-sm sm:text-base text-stone-600 mt-2 font-bold">Neyi keşfetmek istersin?</p>
    </div>

    <div id="subCategoryScroll" class="hidden overflow-x-auto whitespace-nowrap py-4 mb-6 space-x-3 no-scrollbar flex justify-start md:justify-center px-2"></div>

    <!-- İçerik Değişimlerinde Animasyon Alacak Konteyner -->
    <div id="animContainer" class="page-enter">
      <div id="contentList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

  </main>

  <!-- Scriptleri bağla -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
